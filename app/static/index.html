<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FOSSFinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@380;520;640&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1915;
      --muted: #5e584f;
      --paper: #f4efe6;
      --card: #fffaf3;
      --line: #e2d8c8;
      --accent: #0f6e56;
      --accent-ink: #08382c;
      --warn: #8a3d12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 100% -10%, #d7efe4 0%, transparent 55%),
        var(--paper);
      font-family: Outfit, sans-serif;
    }
    main { max-width: 980px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 {
      font-family: Fraunces, serif;
      font-size: clamp(40px, 6vw, 68px);
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin: 0 0 12px;
    }
    .lede { max-width: 62ch; color: var(--muted); font-size: 18px; margin: 0 0 28px; }
    form, .result, .profile {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    form { padding: 18px; display: grid; gap: 14px; }
    .drop {
      border: 1.5px dashed #b7cbbf;
      border-radius: 14px;
      padding: 22px;
      background: #f3faf6;
    }
    input[type="file"] { font: inherit; }
    button {
      justify-self: start;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 640;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { min-height: 1.2em; color: var(--warn); }
    .profile, .result { margin-top: 16px; padding: 18px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
      background: #e7f5ee;
      color: var(--accent-ink);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 14px;
    }
    article + article { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
    .score { font-family: Fraunces, serif; font-size: 28px; }
    a { color: var(--accent-ink); }
    .meta { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Find a pull request you can finish.</h1>
    <p class="lede">Upload a PDF resume. Gemini reads the skills, GitHub supplies open issues, and MongoDB Atlas keeps the repositories.</p>
    <form id="match-form">
      <label class="drop">
        PDF resume
        <input id="resume" name="resume" type="file" accept="application/pdf,.pdf" required />
      </label>
      <button type="submit">Match open issues</button>
      <p class="status" id="status" role="status"></p>
    </form>
    <section id="output"></section>
  </main>
  <script>
    const form = document.querySelector("#match-form");
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[ch]);
    }

    function safeUrl(url) {
      try {
        const parsed = new URL(url);
        if (parsed.protocol === "https:" || parsed.protocol === "http:") return escapeHtml(parsed.href);
      } catch (error) {
        return "#";
      }
      return "#";
    }

    function chips(items) {
      return (items || []).map((item) => `<span class="chip">${escapeHtml(item)}</span>`).join("");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = document.querySelector("#resume").files[0];
      if (!file) return;
      status.textContent = "Reading the resume and searching GitHub…";
      output.innerHTML = "";
      form.querySelector("button").disabled = true;
      try {
        const body = new FormData();
        body.append("resume", file);
        const response = await fetch("/api/match", { method: "POST", body });
        const payload = await response.json();
        if (!response.ok) {
          status.textContent = typeof payload.detail === "string" ? payload.detail : "Match failed.";
          return;
        }
        status.textContent = payload.used_fallback
          ? "Ranked from skill overlap because Gemini ranking was unavailable."
          : `Saved ${payload.stored.repos} repos and ${payload.stored.issues} issues in Atlas.`;
        const profile = payload.profile;
        const cards = payload.matches.map((match) => `
          <article>
            <div class="score">${escapeHtml(match.score)}</div>
            <h2><a href="${safeUrl(match.url)}" target="_blank" rel="noreferrer">${escapeHtml(match.title)}</a></h2>
            <p>${escapeHtml(match.why)}</p>
            <p><strong>First step.</strong> ${escapeHtml(match.first_step)}</p>
            <p class="meta">${escapeHtml(match.repo.full_name)} · ${escapeHtml(match.repo.language || "unknown language")} · ${escapeHtml(match.repo.stars ?? "?")} stars</p>
          </article>
        `).join("");
        output.innerHTML = `
          <section class="profile">
            <h2>Profile</h2>
            <p>${escapeHtml(profile.summary)}</p>
            <div class="chips">${chips(profile.languages)}${chips(profile.frameworks)}</div>
          </section>
          <section class="result">${cards}</section>
        `;
      } catch (error) {
        status.textContent = "The request did not finish. Check that the server is still running.";
      } finally {
        form.querySelector("button").disabled = false;
      }
    });
  </script>
</body>
</html>
